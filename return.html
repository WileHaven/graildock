<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Return to GrailDock</title>
<style>
  body { font-family: system-ui, sans-serif; line-height: 1.6; max-width: 480px; margin: 0 auto; padding: 48px 20px; text-align: center; color: #1a1a1a; }
  a.button { display: inline-block; margin-top: 16px; padding: 14px 28px; background: #208AEF; color: #fff; border-radius: 12px; text-decoration: none; font-weight: 700; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
</style>
</head>
<body>
<h1 id="title">Back to GrailDock</h1>
<p id="message">Tap the button to return to the app.</p>
<a class="button" id="open" href="collectibles://ebay-connected">Return to GrailDock</a>
<p id="hint" style="margin-top:28px;font-size:14px;opacity:.75">If the button does nothing, close this tab with the X at the top left. GrailDock will already show eBay as connected.</p>
<p id="target" style="font-size:11px;opacity:.5;word-break:break-all"></p>
<script>
  var params = new URLSearchParams(location.search);
  var status = params.get('status');
  var message = params.get('message');

  if (status === 'connected') {
    document.getElementById('title').textContent = 'eBay connected';
    document.getElementById('message').textContent = 'Tap the button to go back to GrailDock.';
  } else if (status === 'error') {
    document.getElementById('title').textContent = 'eBay was not connected';
    document.getElementById('message').textContent = (message || 'Something went wrong.') + ' Go back to GrailDock and try again.';
  }

  // The app link comes from the address, so only the app's own schemes are accepted.
  // Anything else falls back to the app's default link, never to another site.
  var app = params.get('app') || '';
  var allowed = /^(collectibles|exp|exps):\/\/[A-Za-z0-9._~:\/@!$&'()*+,;=%-]*(\?[A-Za-z0-9._~:\/@!$&'()*+,;=%?-]*)?$/;
  var base = allowed.test(app) ? app : 'collectibles://ebay-connected';

  var query = [];
  if (status === 'connected' || status === 'error') query.push('status=' + encodeURIComponent(status));
  if (status === 'error' && message) query.push('message=' + encodeURIComponent(message));
  var joiner = base.indexOf('?') === -1 ? '?' : '&';
  var target = base + (query.length ? joiner + query.join('&') : '');
  document.getElementById('open').href = target;
  document.getElementById('target').textContent = 'Link: ' + target + '  |  received app=' + (app === '' ? '(none)' : app) + '  |  accepted=' + allowed.test(app);
</script>
</body>
</html>
